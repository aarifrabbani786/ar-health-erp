<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>A.R. Medical Store POS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="pos-container">
        <!-- Header -->
        <header class="pos-header">
            <h2>A.R. Medical Store POS</h2>
            <div>
                <button onclick="require('electron').shell.openExternal('http://localhost:5000')" style="background: #2563eb; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-right: 10px;">
                    📊 Open Web Dashboard
                </button>
                <span class="badge-online">Online</span>
            </div>
        </header>

        <!-- Main Grid -->
        <div class="pos-grid">
            <!-- Left: Search & Cart -->
            <div class="pos-left">
                <div class="search-box">
                    <input type="text" id="itemSearch" placeholder="Search Medicine by Name, Batch [F2]..." autocomplete="off">
                    <div id="searchResults" class="search-dropdown hidden"></div>
                </div>

                <div class="table-wrapper">
                    <table class="cart-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Item Name</th>
                                <th>Batch</th>
                                <th>Exp</th>
                                <th>Qty</th>
                                <th>MRP</th>
                                <th>Rate</th>
                                <th>Total</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="cartItems">
                            <tr><td colspan="9" style="text-align:center; padding: 20px; color: #888;">Cart is empty. Search medicine to add.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Right: Billing & Totals -->
            <div class="pos-right">
                <div class="totals-card">
                    <h3>Bill Details</h3>
                    <div class="cust-info">
                        <label>Customer Details:</label>
                        <input type="text" id="custName" placeholder="Customer Name [F4]">
                        <input type="text" id="custPhone" placeholder="Mobile Number">
                    </div>

                    <div class="disc-box">
                        <label>Discount Amount (₹):</label>
                        <input type="number" id="discInput" value="0" oninput="calculateTotals()">
                    </div>

                    <div class="payment-box">
                        <label>Payment Mode:</label>
                        <select id="payMode">
                            <option value="Cash">Cash</option>
                            <option value="UPI">UPI</option>
                            <option value="Credit">Credit</option>
                        </select>
                    </div>

                    <hr style="margin: 15px 0; border:0; border-top:1px solid #cbd5e1;">

                    <div class="total-row"><span>Subtotal:</span> <span id="subTotal">₹0.00</span></div>
                    <div class="total-row"><span>Discount:</span> <span id="discAmount">₹0.00</span></div>
                    <div class="grand-total-row"><span>Grand Total:</span> <span id="grandTotal">₹0.00</span></div>

                    <button class="btn-checkout" onclick="processCheckout()">[F12] Settle & Print Bill</button>
                </div>
            </div>
        </div>

        <!-- Footer Shortcuts -->
        <footer class="shortcut-bar">
            <span class="key-badge"><kbd>F1</kbd> New Bill</span>
            <span class="key-badge"><kbd>F2</kbd> Search</span>
            <span class="key-badge"><kbd>F4</kbd> Customer</span>
            <span class="key-badge"><kbd>F8</kbd> Discount</span>
            <span class="key-badge"><kbd>F12</kbd> Pay & Print</span>
            <span class="key-badge"><kbd>Esc</kbd> Cancel</span>
        </footer>
    </div>

    <script src="pos.js"></script>
</body>
</html>
