<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AR Healthcare ERP | Enterprise 3D Suite</title>
<style>
:root {
    --navy: #0f172a;
    --navy-dark: #070d19;
    --blue: #0284c7;
    --blue-gradient: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
    --green-gradient: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
    --red-gradient: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
    --bg-3d: #e2e8f0;
    --card-3d: #e2e8f0;
    --text: #0f172a;
    --muted: #475569;
    --shadow-out: 8px 8px 16px #b8c2cc, -8px -8px 16px #ffffff;
    --shadow-in: inset 4px 4px 8px #b8c2cc, inset -4px -4px 8px #ffffff;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', 'Segoe UI', sans-serif; font-weight: 900 !important; }
body { background: var(--bg-3d); color: var(--text); min-height: 100vh; overflow-x: hidden; }

/* 3D Glass & Neumorphic Buttons & Inputs */
input, select, textarea {
    background: var(--card-3d); border: none; outline: none; padding: 11px 14px;
    border-radius: 10px; box-shadow: var(--shadow-in); color: var(--text); font-size: 12.5px; width: 100%; transition: all 0.2s;
}
input:focus, select:focus, textarea:focus { box-shadow: inset 6px 6px 10px #94a3b8, inset -6px -6px 10px #ffffff; }

.btn {
    border: none; outline: none; padding: 10px 16px; border-radius: 10px; cursor: pointer;
    box-shadow: 5px 5px 10px #b8c2cc, -5px -5px 10px #ffffff; color: var(--text); background: var(--card-3d);
    font-size: 12px; transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px; justify-content: center;
}
.btn:active { box-shadow: var(--shadow-in); transform: translateY(1px); }
.btn.primary { background: var(--blue-gradient); color: white; box-shadow: 4px 6px 15px rgba(2, 132, 199, 0.4); }
.btn.success { background: var(--green-gradient); color: white; box-shadow: 4px 6px 15px rgba(22, 163, 74, 0.4); }
.btn.danger { background: var(--red-gradient); color: white; box-shadow: 4px 6px 15px rgba(239, 68, 68, 0.4); }

/* AUTH OVERLAY */
#auth-overlay {
    position: fixed; inset: 0; background: var(--bg-3d); z-index: 999999;
    display: flex; align-items: center; justify-content: center; padding: 20px;
}
.login-card-3d {
    width: 100%; max-width: 440px; background: var(--card-3d); border-radius: 24px; padding: 35px;
    box-shadow: 14px 14px 28px #b8c2cc, -14px -14px 28px #ffffff; border: 1px solid rgba(255,255,255,0.8);
}
.login-card-3d h2 { text-align: center; font-size: 18px; color: var(--navy); margin-bottom: 4px; text-transform: uppercase; }
.login-card-3d .sub { text-align: center; font-size: 11px; color: var(--blue); margin-bottom: 22px; }

.input-group-3d { position: relative; margin-bottom: 16px; }
.input-group-3d label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; }
.eye-btn { position: absolute; right: 12px; top: 32px; background: none; border: none; cursor: pointer; font-size: 16px; color: var(--muted); }

/* MAIN APP LAYOUT */
.app { display: flex; width: 100vw; height: 100vh; overflow: hidden; }
.sidebar {
    width: 280px; background: var(--navy); color: #cbd5e1; flex-shrink: 0;
    display: flex; flex-direction: column; height: 100vh; overflow-y: auto; border-right: 2px solid rgba(255,255,255,0.05);
}
.brand { padding: 20px 16px; border-bottom: 1px solid rgba(255,255,255,0.08); text-align: center; }
.brand-box {
    display: inline-flex; align-items: center; gap: 10px; padding: 8px 14px;
    background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); border-radius: 14px;
    box-shadow: 0 6px 18px rgba(2, 132, 199, 0.4), inset 0 2px 4px rgba(255,255,255,0.4); color: white;
}
.nav-list { list-style: none; padding: 10px; flex: 1; }
.nav-group-label { font-size: 10px; color: #64748b; padding: 14px 10px 4px; text-transform: uppercase; letter-spacing: 1px; }
.nav-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; color: #cbd5e1;
    text-decoration: none; border-radius: 10px; font-size: 11.5px; cursor: pointer; margin-bottom: 3px; transition: all 0.2s;
}
.nav-item:hover, .nav-item.active { background: var(--blue-gradient); color: white; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3); }

.main-content { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow-y: auto; padding: 20px; background: #f8fafc; }
.topbar {
    background: var(--card-3d); padding: 12px 20px; border-radius: 16px;
    box-shadow: var(--shadow-out); display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
}
.search-box { width: 320px; position: relative; }

.panel-3d {
    background: #ffffff; border-radius: 18px; padding: 22px; margin-bottom: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.04); border: 1.5px solid #e2e8f0;
}
.panel-3d h2 { font-size: 16px; color: var(--navy); margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }

.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 16px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 10.5px; color: var(--muted); text-transform: uppercase; }

.data-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
.data-table th, .data-table td { padding: 12px 14px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 12px; }
.data-table th { background: #f1f5f9; color: var(--muted); text-transform: uppercase; font-size: 10.5px; }

.badge { padding: 4px 8px; border-radius: 6px; font-size: 10px; color: white; display: inline-block; }
.badge.active { background: #16a34a; }
.badge.inactive { background: #ef4444; }

.crm-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; margin-bottom: 20px; }
.crm-card {
    background: var(--card-3d); padding: 18px; border-radius: 16px; box-shadow: var(--shadow-out);
}
.crm-title { font-size: 11px; color: var(--muted); text-transform: uppercase; }
.crm-val { font-size: 24px; color: var(--navy); margin-top: 6px; }

/* AUTO-COMPLETE DROPDOWN */
.autocomplete-items {
    position: absolute; border: 1.5px solid #cbd5e1; border-top: none; z-index: 99;
    top: 100%; left: 0; right: 0; background-color: #ffffff; border-radius: 0 0 10px 10px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); max-height: 160px; overflow-y: auto;
}
.autocomplete-items div { padding: 10px; cursor: pointer; font-size: 12px; border-bottom: 1px solid #f1f5f9; }
.autocomplete-items div:hover { background-color: #e0f2fe; color: #0284c7; }

#profileModal {
    display: none; position: fixed; right: 20px; top: 75px; width: 300px;
    background: #ffffff; border-radius: 16px; border: 1.5px solid #cbd5e1;
    box-shadow: 0 15px 35px rgba(0,0,0,0.18); padding: 18px; z-index: 9999;
}
</style>
</head>
<body>

    <!-- 3D LOGIN OVERLAY -->
    <div id="auth-overlay">
        <div class="login-card-3d">
            <h2>AR HEALTHCARE ERP</h2>
            <div class="sub">Proprietor: DRx. Aarif Rabbani</div>

            <div class="input-group-3d">
                <label>User ID *</label>
                <input type="text" id="loginUser" placeholder="Enter User ID" value="Aarif">
            </div>

            <div class="input-group-3d">
                <label>Password *</label>
                <input type="password" id="loginPass" placeholder="Enter Password" value="7860">
                <button type="button" class="eye-btn" onclick="togglePassword('loginPass')">👁️</button>
            </div>

            <div style="text-align: right; margin-top: -8px; margin-bottom: 16px;">
                <a onclick="forgotPassword()" style="font-size: 11px; color: var(--blue); cursor: pointer;">Forgot Password?</a>
            </div>

            <button onclick="handleLogin()" class="btn primary" style="width: 100%; padding: 12px;">LOGIN TO SYSTEM</button>
        </div>
    </div>

    <!-- MAIN APP STRUCTURE -->
    <div class="app">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="brand">
                <div class="brand-box">
                    <span>🌿</span> AR HEALTHCARE ERP
                </div>
            </div>
            <div class="nav-list" id="sidebarMenu"></div>
        </div>

        <!-- CONTENT -->
        <div class="main-content">
            <div class="topbar">
                <div class="search-box">
                    <input type="text" id="globalModuleSearch" placeholder="🔍 Search modules or data..." onkeyup="filterGlobalData()">
                </div>
                
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div style="text-align: right;">
                        <div style="font-size: 12.5px; color: var(--navy);" id="topUserName">Aarif</div>
                        <div style="font-size: 10px; color: var(--blue);" id="topUserRole">Super Admin (Locked)</div>
                    </div>
                    <div onclick="toggleProfileModal()" style="width: 40px; height: 40px; background: var(--blue-gradient); color: white; border-radius: 50%; display: grid; place-items: center; cursor: pointer; box-shadow: 0 4px 10px rgba(2, 132, 199, 0.4);" id="userAvatar">A</div>
                </div>
            </div>

            <!-- PROFILE & SECURITY MODAL -->
            <div id="profileModal">
                <h3 style="font-size: 14px; margin-bottom: 10px; border-bottom: 1px solid #e2e8f0; padding-bottom: 6px;">Profile & Security</h3>
                <div class="field" style="margin-bottom: 8px;">
                    <label>Username</label>
                    <input type="text" id="profUsername">
                </div>
                <div class="field" style="margin-bottom: 12px;">
                    <label>New Password</label>
                    <input type="password" id="profNewPass" placeholder="Leave blank if same">
                </div>
                <button class="btn success" onclick="updateProfile()" style="width: 100%; margin-bottom: 8px;">Update Profile</button>
                <button class="btn danger" onclick="handleLogout()" style="width: 100%;">🚪 Logout System</button>
            </div>

            <!-- WORKSPACE -->
            <div id="workspace"></div>
        </div>
    </div>

    <script>
        // MASTER STATE MANAGEMENT
        let currentUser = null;

        // DEFAULT USERS (Super Admin Locked)
        let defaultUsers = [
            { id: 'USR-001', name: 'DRx. Aarif Rabbani', username: 'Aarif', pass: '7860', role: 'Super Admin', status: 'Active', isLocked: true, permissions: ['all'] },
            { id: 'USR-002', name: 'Pharmacist User', username: 'pharma', pass: '1234', role: 'Pharmacist', status: 'Active', isLocked: false, permissions: ['medicines', 'sales', 'stock'] },
            { id: 'USR-003', name: 'BME Engineer', username: 'bme', pass: '1234', role: 'Biomedical Engineer', status: 'Active', isLocked: false, permissions: ['assets', 'bme'] }
        ];

        let usersList = JSON.parse(localStorage.getItem('ar_erp_users')) || defaultUsers;
        if (!localStorage.getItem('ar_erp_users')) localStorage.setItem('ar_erp_users', JSON.stringify(usersList));

        // MASTER MEDICINES & TESTS DATABASE FOR AUTO-FETCH
        let masterItems = [
            { name: "Paracetamol 650mg", category: "Tablet", price: 30, hsn: "3004" },
            { name: "Amoxicillin 500mg", category: "Capsule", price: 85, hsn: "3004" },
            { name: "Dolo 650", category: "Tablet", price: 32, hsn: "3004" },
            { name: "Azithromycin 500mg", category: "Tablet", price: 120, hsn: "3004" },
            { name: "Complete Blood Count (CBC)", category: "Lab Test", price: 350, hsn: "9993" },
            { name: "Chest X-Ray Digital", category: "Radiology", price: 500, hsn: "9993" },
            { name: "USG Abdomen", category: "Ultrasound", price: 800, hsn: "9993" },
            { name: "ECG 12 Lead", category: "Cardiology", price: 250, hsn: "9993" }
        ];

        // SIDEBAR NAVIGATION CONFIGURATION
        const navMenu = [
            { group: "OVERVIEW", items: [ { id: "dashboard", label: "Dashboard", icon: "📊" } ] },
            { group: "HOSPITAL MANAGEMENT", items: [
                { id: "patient_reg", label: "Patient Registration / UHID", icon: "🏥" },
                { id: "opd", label: "OPD Appointments", icon: "🩺" },
                { id: "ipd", label: "IPD Admissions & Beds", icon: "🛏️" }
            ]},
            { group: "PHARMACY MANAGEMENT", items: [
                { id: "medicines", label: "Medicine Master & Stock", icon: "📦" },
                { id: "sales", label: "Sales Billing & Dispensing", icon: "🛒" }
            ]},
            { group: "BIOMEDICAL ENGINEERING", items: [
                { id: "assets", label: "Biomedical Asset Master", icon: "⚙️" }
            ]},
            { group: "ADMINISTRATION", items: [
                { id: "users_admin", label: "User & Role Management", icon: "🛡️" }
            ]}
        ];

        // AUTO SMART ID GENERATOR (Format: AR + Month/Day/Year + Counter)
        function generateSmartID(prefix) {
            let today = new Date();
            let dd = String(today.getDate()).padStart(2, '0');
            let mm = String(today.getMonth() + 1).padStart(2, '0');
            let yy = String(today.getFullYear()).slice(-2);
            let rand = Math.floor(10 + Math.random() * 90);
            return `${prefix}${dd}${mm}${yy}${rand}`;
        }

        window.addEventListener('DOMContentLoaded', () => {
            let session = localStorage.getItem('ar_erp_active_session');
            if (session) {
                currentUser = JSON.parse(session);
                document.getElementById('auth-overlay').style.display = 'none';
                initApp();
            } else {
                document.getElementById('auth-overlay').style.display = 'flex';
            }
        });

        function togglePassword(id) {
            let input = document.getElementById(id);
            if(input) input.type = input.type === 'password' ? 'text' : 'password';
        }

        function handleLogin() {
            let u = document.getElementById('loginUser').value.trim();
            let p = document.getElementById('loginPass').value.trim();

            let found = usersList.find(x => x.username.toLowerCase() === u.toLowerCase() && x.pass === p);
            if (found) {
                if (found.status !== 'Active') {
                    alert('Your account is Deactivated by Super Admin!');
                    return;
                }
                currentUser = found;
                localStorage.setItem('ar_erp_active_session', JSON.stringify(found));
                document.getElementById('auth-overlay').style.display = 'none';
                initApp();
            } else {
                alert('Invalid User ID or Password!');
            }
        }

        function forgotPassword() {
            let u = prompt('Enter your User ID for password recovery:');
            if (u) {
                alert('Password reset request logged for Super Admin Aarif!');
            }
        }

        function handleLogout() {
            localStorage.removeItem('ar_erp_active_session');
            location.reload();
        }

        function initApp() {
            document.getElementById('topUserName').innerText = currentUser.name;
            document.getElementById('topUserRole').innerText = currentUser.role + (currentUser.isLocked ? ' (Locked)' : '');
            document.getElementById('userAvatar').innerText = currentUser.name.charAt(0).toUpperCase();
            document.getElementById('profUsername').value = currentUser.username;

            renderSidebar();
            loadModule(localStorage.getItem('ar_active_module') || 'dashboard');
        }

        function renderSidebar() {
            let container = document.getElementById('sidebarMenu');
            let html = '';
            navMenu.forEach(g => {
                html += `<div class="nav-group-label">${g.group}</div>`;
                g.items.forEach(i => {
                    html += `<a class="nav-item" onclick="loadModule('${i.id}')" id="nav-${i.id}"><span>${i.icon}</span> ${i.label}</a>`;
                });
            });
            container.innerHTML = html;
        }

        function toggleProfileModal() {
            let m = document.getElementById('profileModal');
            m.style.display = m.style.display === 'block' ? 'none' : 'block';
        }

        function updateProfile() {
            let newU = document.getElementById('profUsername').value.trim();
            let newP = document.getElementById('profNewPass').value.trim();

            if (!newU) return alert('Username required');
            let idx = usersList.findIndex(x => x.username === currentUser.username);
            if (idx !== -1) {
                usersList[idx].username = newU;
                if (newP) usersList[idx].pass = newP;
                currentUser = usersList[idx];
                localStorage.setItem('ar_erp_users', JSON.stringify(usersList));
                localStorage.setItem('ar_erp_active_session', JSON.stringify(currentUser));
                alert('Profile Updated Successfully!');
                toggleProfileModal();
                initApp();
            }
        }

        function loadModule(modId) {
            localStorage.setItem('ar_active_module', modId);
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            let activeNav = document.getElementById(`nav-${modId}`);
            if (activeNav) activeNav.classList.add('active');

            let ws = document.getElementById('workspace');
            ws.innerHTML = '';

            if (modId === 'dashboard') renderDashboard(ws);
            else if (modId === 'patient_reg') renderPatients(ws);
            else if (modId === 'opd') renderOPD(ws);
            else if (modId === 'medicines') renderMedicines(ws);
            else if (modId === 'sales') renderSales(ws);
            else if (modId === 'assets') renderAssets(ws);
            else if (modId === 'users_admin') renderUserManagement(ws);
            else renderDashboard(ws);
        }

        // DASHBOARD MODULE WITH AUTO-CALCULATED STATS
        function renderDashboard(ws) {
            let patients = JSON.parse(localStorage.getItem('ar_patients')) || [];
            let sales = JSON.parse(localStorage.getItem('ar_sales')) || [];
            let medicines = JSON.parse(localStorage.getItem('ar_medicines')) || [];
            let totalRev = sales.reduce((a, b) => a + Number(b.amount || 0), 0);

            ws.innerHTML = `
                <div class="crm-grid">
                    <div class="crm-card">
                        <div class="crm-title">Total Revenue</div>
                        <div class="crm-val" style="color:#16a34a;">₹${totalRev.toFixed(2)}</div>
                    </div>
                    <div class="crm-card">
                        <div class="crm-title">Registered Patients</div>
                        <div class="crm-val" style="color:#0284c7;">${patients.length}</div>
                    </div>
                    <div class="crm-card">
                        <div class="crm-title">Medicine Items</div>
                        <div class="crm-val">${medicines.length}</div>
                    </div>
                    <div class="crm-card">
                        <div class="crm-title">Total Staff Users</div>
                        <div class="crm-val">${usersList.length}</div>
                    </div>
                </div>

                <div class="panel-3d">
                    <h2>📊 System Status & Automatic Sync</h2>
                    <p style="font-size:13px; color:var(--muted);">All modules connected. Smart ID generation and auto-fetch enabled.</p>
                </div>
            `;
        }

        // PATIENT REGISTRATION MODULE WITH AUTO SMART UHID
        function renderPatients(ws) {
            let patients = JSON.parse(localStorage.getItem('ar_patients')) || [];
            ws.innerHTML = `
                <div class="panel-3d">
                    <h2>🏥 Patient Registration & UHID Auto Generator</h2>
                    <div class="form-grid">
                        <div class="field"><label>Patient Name *</label><input type="text" id="pName" placeholder="Full Name"></div>
                        <div class="field"><label>Mobile No *</label><input type="text" id="pMobile" placeholder="10 Digit Mobile"></div>
                        <div class="field"><label>Gender</label><select id="pGender"><option>Male</option><option>Female</option></select></div>
                        <div class="field" style="justify-content:flex-end;"><button class="btn success" onclick="addPatient()">Save & Generate UHID</button></div>
                    </div>
                </div>

                <div class="panel-3d">
                    <h2>Registered Patients List</h2>
                    <table class="data-table">
                        <thead><tr><th>UHID No</th><th>Name</th><th>Mobile</th><th>Gender</th><th>Actions</th></tr></thead>
                        <tbody>
                            ${patients.map((p, idx) => `
                                <tr>
                                    <td><b>${p.uhid}</b></td>
                                    <td>${p.name}</td>
                                    <td>${p.mobile}</td>
                                    <td>${p.gender}</td>
                                    <td>${currentUser.role === 'Super Admin' ? `<button class="btn danger" onclick="deletePatient(${idx})">Delete</button>` : 'Protected'}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;

            window.addPatient = function() {
                let name = document.getElementById('pName').value.trim();
                let mobile = document.getElementById('pMobile').value.trim();
                let gender = document.getElementById('pGender').value;

                if (!name || !mobile) return alert('Name and Mobile Required!');
                let uhid = generateSmartID('AR');
                patients.unshift({ uhid, name, mobile, gender });
                localStorage.setItem('ar_patients', JSON.stringify(patients));
                renderPatients(ws);
            };

            window.deletePatient = function(idx) {
                if (confirm('Delete patient record?')) {
                    patients.splice(idx, 1);
                    localStorage.setItem('ar_patients', JSON.stringify(patients));
                    renderPatients(ws);
                }
            };
        }

        // SALES & BILLING WITH AUTO-FETCH AUTO-COMPLETE
        function renderSales(ws) {
            let sales = JSON.parse(localStorage.getItem('ar_sales')) || [];
            ws.innerHTML = `
                <div class="panel-3d">
                    <h2>🛒 Pharmacy Sales & Billing (Auto-Fetch Enabled)</h2>
                    <div class="form-grid">
                        <div class="field"><label>Customer Name *</label><input type="text" id="sCust" placeholder="Customer Name"></div>
                        <div class="field" style="position:relative;">
                            <label>Item Name (Type to Auto-Fetch) *</label>
                            <input type="text" id="sItem" placeholder="Type medicine or test..." onkeyup="autoFetchItem(this.value)">
                            <div id="autoDropdown" class="autocomplete-items" style="display:none;"></div>
                        </div>
                        <div class="field"><label>Amount (₹)</label><input type="number" id="sAmt" value="100"></div>
                        <div class="field" style="justify-content:flex-end;"><button class="btn success" onclick="addSale()">Generate Bill</button></div>
                    </div>
                </div>

                <div class="panel-3d">
                    <h2>Sales History</h2>
                    <table class="data-table">
                        <thead><tr><th>Invoice No</th><th>Customer</th><th>Item</th><th>Amount</th><th>Action</th></tr></thead>
                        <tbody>
                            ${sales.map((s, idx) => `
                                <tr>
                                    <td><b>${s.invNo}</b></td>
                                    <td>${s.cust}</td>
                                    <td>${s.item}</td>
                                    <td>₹${s.amount}</td>
                                    <td>${currentUser.role === 'Super Admin' ? `<button class="btn danger" onclick="deleteSale(${idx})">Delete</button>` : 'Protected'}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;

            window.autoFetchItem = function(val) {
                let drop = document.getElementById('autoDropdown');
                if (!val) { drop.style.display = 'none'; return; }
                let matches = masterItems.filter(x => x.name.toLowerCase().includes(val.toLowerCase()));
                if (matches.length > 0) {
                    drop.innerHTML = matches.map(m => `<div onclick="selectItem('${m.name}', ${m.price})">${m.name} - ₹${m.price}</div>`).join('');
                    drop.style.display = 'block';
                } else { drop.style.display = 'none'; }
            };

            window.selectItem = function(name, price) {
                document.getElementById('sItem').value = name;
                document.getElementById('sAmt').value = price;
                document.getElementById('autoDropdown').style.display = 'none';
            };

            window.addSale = function() {
                let cust = document.getElementById('sCust').value.trim();
                let item = document.getElementById('sItem').value.trim();
                let amount = document.getElementById('sAmt').value;
                if (!cust || !item) return alert('Customer and Item Required!');
                let invNo = generateSmartID('ARINV');
                sales.unshift({ invNo, cust, item, amount });
                localStorage.setItem('ar_sales', JSON.stringify(sales));
                renderSales(ws);
            };

            window.deleteSale = function(idx) {
                if (confirm('Delete Sale Record?')) {
                    sales.splice(idx, 1);
                    localStorage.setItem('ar_sales', JSON.stringify(sales));
                    renderSales(ws);
                }
            };
        }

        // USER & ROLE MANAGEMENT (SUPER ADMIN CONTROLLED)
        function renderUserManagement(ws) {
            ws.innerHTML = `
                <div class="panel-3d">
                    <h2>🛡️ User & Role Management (Super Admin Control)</h2>
                    ${currentUser.role === 'Super Admin' ? `
                    <div class="form-grid">
                        <div class="field"><label>Staff Full Name *</label><input type="text" id="uName" placeholder="Full Name"></div>
                        <div class="field"><label>User ID *</label><input type="text" id="uId" placeholder="User ID"></div>
                        <div class="field"><label>Password *</label><input type="password" id="uPass" placeholder="Password"></div>
                        <div class="field"><label>Role</label><select id="uRole"><option>Pharmacist</option><option>Biomedical Engineer</option><option>Receptionist</option><option>Accountant</option></select></div>
                        <div class="field" style="justify-content:flex-end;"><button class="btn primary" onclick="addUser()">Create User Account</button></div>
                    </div>
                    ` : '<p style="color:var(--muted);">Only Super Admin can create or modify users.</p>'}
                </div>

                <div class="panel-3d">
                    <h2>All Staff Accounts</h2>
                    <table class="data-table">
                        <thead><tr><th>User ID</th><th>Name</th><th>Role</th><th>Status</th><th>Actions & Permissions</th></tr></thead>
                        <tbody>
                            ${usersList.map((u, idx) => `
                                <tr>
                                    <td><b>${u.username}</b> ${u.isLocked ? '🔒' : ''}</td>
                                    <td>${u.name}</td>
                                    <td>${u.role}</td>
                                    <td><span class="badge ${u.status === 'Active' ? 'active' : 'inactive'}">${u.status}</span></td>
                                    <td>
                                        ${currentUser.role === 'Super Admin' && !u.isLocked ? `
                                            <button class="btn success" onclick="toggleUserStatus(${idx})">${u.status === 'Active' ? 'Deactivate' : 'Activate'}</button>
                                            <button class="btn danger" onclick="deleteUser(${idx})">Delete</button>
                                        ` : (u.isLocked ? 'Protected (Super Admin)' : 'No Access')}
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;

            window.addUser = function() {
                let name = document.getElementById('uName').value.trim();
                let username = document.getElementById('uId').value.trim();
                let pass = document.getElementById('uPass').value.trim();
                let role = document.getElementById('uRole').value;

                if (!name || !username || !pass) return alert('Fill all required fields!');
                if (usersList.some(x => x.username.toLowerCase() === username.toLowerCase())) return alert('User ID already exists!');

                usersList.push({ id: 'USR-' + Date.now(), name, username, pass, role, status: 'Active', isLocked: false });
                localStorage.setItem('ar_erp_users', JSON.stringify(usersList));
                renderUserManagement(ws);
            };

            window.toggleUserStatus = function(idx) {
                usersList[idx].status = usersList[idx].status === 'Active' ? 'Inactive' : 'Active';
                localStorage.setItem('ar_erp_users', JSON.stringify(usersList));
                renderUserManagement(ws);
            };

            window.deleteUser = function(idx) {
                if (confirm('Delete user account?')) {
                    usersList.splice(idx, 1);
                    localStorage.setItem('ar_erp_users', JSON.stringify(usersList));
                    renderUserManagement(ws);
                }
            };
        }

        function renderOPD(ws) { ws.innerHTML = `<div class="panel-3d"><h2>🩺 OPD Appointments</h2><p>Module Active.</p></div>`; }
        function renderMedicines(ws) { ws.innerHTML = `<div class="panel-3d"><h2>📦 Medicine Master</h2><p>Module Active.</p></div>`; }
        function renderAssets(ws) { ws.innerHTML = `<div class="panel-3d"><h2>⚙️ Biomedical Assets</h2><p>Module Active.</p></div>`; }
        function filterGlobalData() { /* Instant Search Implementation */ }
    </script>
</body>
</html>
