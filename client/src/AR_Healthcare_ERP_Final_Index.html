px solid var(--line);border-radius:10px;background:#fff;position:relative}.dot{position:absolute;right:7px;top:6px;width:7px;height:7px;background:#ef5b67;border-radius:50%}.profile{display:flex;align-items:center;gap:10px;border-left:1px solid var(--line);padding-left:14px}.avatar{width:37px;height:37px;border-radius:12px;background:#e4efff;color:#2464c4;display:grid;place-items:center;font-weight:800}.profile strong{font-size:12px;display:block}.profile small{font-size:10px;color:var(--muted)}.content{padding:27px 28px 40px;max-width:1700px;margin:auto}.welcome{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:23px}.eyebrow{color:var(--blue);font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}.welcome h1{font-size:25px;letter-spacing:-.6px;margin:7px 0 7px}.welcome p{color:var(--muted);font-size:12px;margin:0;line-height:1.6}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:9px;padding:10px 13px;font-size:11px;font-weight:700}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.teal{background:var(--cyan);border-color:var(--cyan);color:#fff}.btn.danger{color:var(--red)}.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:17px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0}.stat-top{display:flex;justify-content:space-between;align-items:center}.stat-label{font-size:11px;color:var(--muted);font-weight:600}.stat-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:#edf4ff;color:var(--blue);font-size:16px}.stat-value{font-size:25px;font-weight:800;letter-spacing:-.8px;margin:14px 0 6px}.stat-foot{font-size:10px;color:var(--muted)}.stat-foot b{color:var(--green)}.columns{grid-template-columns:minmax(0,1.45fr) minmax(280px,1fr);margin-bottom:17px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:17px 19px;border-bottom:1px solid var(--line)}.panel-head h3{font-size:13px;margin:0}.panel-head p{font-size:10px;color:var(--muted);margin:5px 0 0}.panel-body{padding:18px}.chart{height:205px;display:flex;align-items:flex-end;gap:12px;padding:12px 8px 0;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 49px,#edf1f7 50px)}.bar-group{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:5px;flex-direction:column;height:100%;min-width:0}.bars{display:flex;align-items:flex-end;gap:4px;height:165px;width:100%;justify-content:center}.bar{width:min(22px,42%);border-radius:5px 5px 0 0;background:linear-gradient(180deg,#5e9cff,#2876ed);min-height:3px}.bar.alt{background:linear-gradient(180deg,#62d7ce,#17b8ae)}.bar-label{font-size:9px;color:var(--muted);padding:8px 0}.legend{display:flex;gap:15px;font-size:10px;color:var(--muted)}.legend span:before{content:"";display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--blue);margin-right:6px}.legend span+span:before{background:var(--cyan)}.alert-list{display:grid;gap:12px}.alert{display:flex;gap:10px;align-items:flex-start;padding:11px;border:1px solid var(--line);border-radius:10px}.alert-symbol{width:32px;height:32px;display:grid;place-items:center;border-radius:9px;background:#fff4df;color:var(--orange);flex-shrink:0}.alert.red .alert-symbol{background:#fff0f1;color:var(--red)}.alert strong{display:block;font-size:11px}.alert small{display:block;color:var(--muted);font-size:10px;margin-top:4px;line-height:1.4}.alert .pill{margin-left:auto}.pill{white-space:nowrap;border-radius:20px;padding:5px 8px;font-size:9px;font-weight:800;background:#eaf8f1;color:var(--green)}.pill.warn{background:#fff4df;color:var(--orange)}.pill.bad{background:#fff0f1;color:var(--red)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;background:#f8fafd;color:#7a8a9e;font-size:9px;letter-spacing:.7px;text-transform:uppercase;padding:12px 16px;font-weight:800}td{padding:13px 16px;border-top:1px solid #edf1f6;font-size:11px}tbody tr:hover{background:#fafcff}.cell-main{font-weight:700}.cell-sub{font-size:9px;color:var(--muted);margin-top:4px}.status{display:inline-block;border-radius:6px;padding:5px 7px;background:#eaf8f1;color:var(--green);font-size:9px;font-weight:800}.status.pending{background:#fff4df;color:var(--orange)}.status.repair{background:#fff0f1;color:var(--red)}.module-title{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.module-title h1{font-size:23px;margin:0 0 6px}.module-title p{font-size:11px;color:var(--muted);margin:0}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.filters input,.filters select,.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:10px 11px;background:#fff;color:var(--text);outline:none;font-size:11px;min-width:0}.filters input{min-width:210px}.empty{padding:38px 18px;text-align:center;color:var(--muted);font-size:12px}.empty strong{display:block;color:var(--text);margin-bottom:6px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;gap:6px}.field label{font-size:10px;font-weight:800;color:#66768a}.field input,.field select,.field textarea{width:100%}.field.full{grid-column:1/-1}.modal-backdrop{position:fixed;inset:0;background:#0c1d30a6;z-index:50;display:none;align-items:center;justify-content:center;padding:20px}.modal-backdrop.show{display:flex}.modal{background:#fff;border-radius:16px;width:min(650px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 70px #0003}.modal-head,.modal-foot{padding:17px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.modal-head h3{font-size:15px;margin:0}.modal-body{padding:20px}.modal-foot{border-top:1px solid var(--line);border-bottom:0;justify-content:flex-end;gap:8px}.close{border:0;background:#eef3f8;border-radius:8px;width:30px;height:30px}.toast{position:fixed;right:22px;bottom:22px;background:#142a40;color:#fff;padding:13px 17px;border-radius:10px;font-size:12px;box-shadow:var(--shadow);z-index:100;display:none;max-width:min(420px,calc(100vw - 40px))}.toast.show{display:block}.notice{padding:12px 14px;border-radius:9px;background:#fff7e8;color:#815a17;font-size:11px;line-height:1.6;margin-bottom:16px}.footer{padding:20px 0 0;color:#95a1b1;font-size:10px;text-align:center}.hide{display:none!important}
@media(max-width:1200px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.columns{grid-template-columns:1fr}.content{padding:22px 20px}}
@media(max-width:760px){.sidebar{transform:translateX(-100%);box-shadow:none}.sidebar.open{transform:translateX(0);box-shadow:10px 0 35px #0003}.main{margin-left:0;width:100%}.hamb{display:block}.topbar{height:65px;padding:0 13px}.search input{width:36vw}.profile .profile-text{display:none}.content{padding:20px 13px 30px}.welcome{display:block}.welcome h1{font-size:22px}.welcome .actions{margin-top:14px}.stats{gap:9px}.stat{padding:13px}.stat-value{font-size:21px}.stat-icon{width:29px;height:29px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.module-title{align-items:flex-start;flex-direction:column}.top-right{gap:6px}.search input{width:32vw;padding-left:30px}.brand{padding:17px}.nav{padding-top:7px}}

<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="logo">AR</div><div><strong>AR HEALTHCARE ERP</strong><small>Hospital • Pharmacy • Biomedical</small></div></div>
  <nav class="nav" id="nav"></nav>
</aside>
<main class="main">
<header class="topbar">
  <div class="top-left"><button class="hamb" id="hamb" aria-label="Toggle menu">☰</button><div class="search"><span>⌕</span><input id="globalSearch" placeholder="Search modules..." autocomplete="off"></div></div>
  <div class="top-right">
    <button class="icon-btn" id="themeBtn" title="Toggle theme">◐</button>
    <button class="icon-btn" id="notificationBtn" title="Notifications">♧<i class="dot"></i></button>
    <div class="profile"><div class="avatar" id="avatar">SA</div><div class="profile-text"><strong id="profileName">Super Admin</strong><small id="profileRole">Full Access</small></div><button class="btn" id="profileMenu">⌄</button></div>
  </div>
</header>
<section class="content" id="content"></section>
</main>
</div>
<div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true">
  <div class="modal"><div class="modal-head"><h3 id="modalTitle">Add Record</h3><button class="close" id="modalClose">✕</button></div><form id="recordForm"><div class="modal-body" id="modalBody"></div><div class="modal-foot"><button type="button" class="btn" id="modalCancel">Cancel</button><button type="submit" class="btn primary">Save Record</button></div></form></div>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
"use strict";
/*
  AR Healthcare ERP - integrated frontend shell.
  This file is a standalone interface/demo shell. Real patient data, secure
  authentication, stock transactions and multi-user permissions require your
  existing backend/API integration. Do not use browser LocalStorage as the
  production source of truth for clinical or financial records.
*/
const groups = [
 {label:"OVERVIEW",items:[["Dashboard","dashboard","▦"],["Notifications","notifications","♧"],["Tasks & Approvals","approvals","✓"]]},
 {label:"HOSPITAL MANAGEMENT",items:[["Patient Registration","patients","＋"],["Patient Search","patient-search","⌕"],["OPD & Appointments","opd","◷"],["IPD Admissions","admissions","▤"],["Wards & Beds","beds","▥"],["Doctors & Departments","doctors","✚"],["Nursing Station","nursing","♡"],["Laboratory","laboratory","⚗"],["Radiology","radiology","◉"],["OT & ICU","ot-icu","✚"],["Discharge Management","discharge","⇥"],["Hospital Billing","hospital-billing","₹"],["Medical Records","medical-records","▧"]]},
 {label:"PHARMACY",items:[["Pharmacy Dashboard","pharmacy","✚"],["Medicine Master","medicines","▤"],["Batch & Strip Stock","batches","▦"],["Purchase Entry","pharmacy-purchase","＋"],["Sales Billing","pharmacy-sales","₹"],["Sales Return","sales-return","↩"],["Customers","customers","♙"],["Suppliers","suppliers","▣"],["Barcode & Labels","barcode","▥"],["Stock Transfer","stock-transfer","⇄"],["Expiry & Low Stock","stock-alerts","⚠"],["Pharmacy Reports","pharmacy-reports","▥"]]},
 {label:"CENTRAL STORE & PURCHASE",items:[["Inventory Dashboard","inventory","▦"],["Item Master","items","▤"],["Warehouses & Stores","warehouses","▣"],["Requisitions","requisitions","☷"],["Goods Receipt (GRN)","grn","⇩"],["Stock Issue / Return","stock-issue","⇄"],["Stock Ledger","stock-ledger","▤"],["Purchase Orders","purchase-orders","▧"],["Vendor Quotations","quotations","▤"],["Supplier Payments","supplier-payments","₹"]]},
 {label:"BIOMEDICAL ENGINEERING",items:[["Biomedical Dashboard","biomedical","⌘"],["Equipment Assets","assets","▣"],["Equipment Complaints","complaints","⚠"],["Work Orders & Repairs","work-orders","🔧"],["Preventive Maintenance","maintenance","◷"],["Calibration Register","calibration","✓"],["AMC / CMC Contracts","contracts","▧"],["Service Vendors","service-vendors","♙"],["Equipment Handover","handover","⇄"],["Equipment Reports","biomed-reports","▥"]]},
 {label:"FINANCE & HRMS",items:[["Accounts Dashboard","accounts","₹"],["Income & Expenses","expenses","⇅"],["Cash & Bank","cash-bank","▤"],["Receivables / Payables","receivables","₹"],["Employee Directory","employees","♙"],["Attendance & Shifts","attendance","◷"],["Leave & Duty Roster","leave","☷"],["Payroll","payroll","₹"]]},
 {label:"REPORTS & ADMINISTRATION",items:[["Reports & Analytics","reports","▥"],["Quality & Compliance","quality","✓"],["Document Register","documents","▧"],["User & Role Management","users","♙"],["Role Permissions","permissions","⚿"],["Audit Logs","audit-logs","☷"],["Branch & Department Setup","organization","▦"],["Settings & Backup","settings","⚙"]]}
];
const allItems = groups.flatMap(g=>g.items.map(x=>({title:x[0],key:x[1],icon:x[2],group:g.label})));
const state={page:"dashboard",role:"Super Admin",name:"Super Admin",records:loadRecords(),users:loadUsers(),theme:"light"};
function loadRecords(){try{return JSON.parse(localStorage.getItem("ar_erp_records")||"{}")}catch{return {}}}
function saveRecords(){try{localStorage.setItem("ar_erp_records",JSON.stringify(state.records))}catch{}}
function loadUsers(){try{const u=JSON.parse(localStorage.getItem("ar_erp_users")||"null");return Array.isArray(u)?u:[{id:"USR-001",name:"Super Admin",username:"admin",role:"Super Admin",department:"Administration",status:"Active"}]}catch{return [{id:"USR-001",name:"Super Admin",username:"admin",role:"Super Admin",department:"Administration",status:"Active"}]}}
function saveUsers(){try{localStorage.setItem("ar_erp_users",JSON.stringify(state.users))}catch{}}
const $=id=>document.getElementById(id);
function escapeHTML(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(msg){$("toast").textContent=msg;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),3200)}
function canManage(){return state.role==="Super Admin"||state.role==="Administrator"}
function canSee(item){if(canManage())return true;const role=state.role.toLowerCase();if(role.includes("pharmac"))return /pharmacy|medicine|batch|purchase|sales|customer|supplier|barcode|stock|inventory|item|warehouse|grn|requisition|report|dashboard|notification/i.test(item.title);if(role.includes("biomedical"))return /biomedical|equipment|work order|repair|maintenance|calibration|amc|service vendor|handover|report|dashboard|notification|task/i.test(item.title);if(role.includes("doctor")||role.includes("nurse"))return /patient|opd|ipd|ward|bed|doctor|nursing|laboratory|radiology|ot|icu|discharge|medical record|dashboard|notification/i.test(item.title);if(role.includes("account"))return /account|income|expense|cash|bank|receivable|payable|billing|report|dashboard/i.test(item.title);if(role.includes("store"))return /inventory|item|warehouse|requisition|grn|stock|purchase|supplier|report|dashboard/i.test(item.title);return /dashboard|notification|tasks|patient registration/i.test(item.title)}
function renderNav(filter=""){let out="";groups.forEach(g=>{const items=g.items.filter(x=>canSee({title:x[0]})&&(!filter||(x[0]+" "+g.label).toLowerCase().includes(filter.toLowerCase())));if(!items.length)return;out+=`<div class="nav-label">${escapeHTML(g.label)}</div>`;items.forEach(x=>out+=`<button class="nav-item ${state.page===x[1]?"active":""}" data-page="${x[1]}"><span class="nav-icon">${x[2]}</span><span>${escapeHTML(x[0])}</span></button>`)});$("nav").innerHTML=out||'<div class="empty">No permitted modules found.</div>'}
function pageTitle(){return allItems.find(x=>x.key===state.page)?.title||"Dashboard"}
function card(label,value,icon,foot="Live data will appear when connected to the backend"){return `<div class="stat"><div class="stat-top"><span class="stat-label">${label}</span><span class="stat-icon">${icon}</span></div><div class="stat-value">${value}</div><div class="stat-foot">${foot}</div></div>`}
function dashboard(){return `<div class="welcome"><div><div class="eyebrow">Healthcare operations platform</div><h1>Good day, ${escapeHTML(state.name)} 👋</h1><p>One workspace for hospital operations, pharmacy inventory and biomedical engineering.</p></div><div class="actions"><button class="btn" data-action="export">Export local demo data</button><button class="btn primary" data-action="quick-add">＋ Quick Add</button></div></div>
<div class="notice"><b>Integration status:</b> This index provides the application shell and navigation. Live figures, secure login, clinical records and stock transactions must be connected to your existing backend/API. The zero/demo state below does not represent real business data.</div>
<div class="grid stats">${card("TODAY'S REVENUE","₹0","₹","Awaiting live API")}${card("ACTIVE PATIENTS","0","♙","Awaiting hospital module")}${card("PHARMACY STOCK ITEMS","0","✚","Awaiting inventory API")}${card("EQUIPMENT ASSETS","0","⌘","Awaiting biomedical API")}</div>
<div class="grid columns"><div class="panel"><div class="panel-head"><div><h3>Operations overview</h3><p>Illustrative chart layout — connect actual reports API</p></div><span class="pill warn">Not connected</span></div><div class="panel-body"><div class="legend"><span>Revenue</span><span>Purchases</span></div><div class="chart">${[["Mon",42,29],["Tue",64,38],["Wed",52,46],["Thu",78,52],["Fri",60,34],["Sat",88,57],["Sun",48,28]].map(([d,a,b])=>`<div class="bar-group"><div class="bars"><div class="bar" style="height:${a}%"></div><div class="bar alt" style="height:${b}%"></div></div><div class="bar-label">${d}</div></div>`).join("")}</div><p class="cell-sub">Illustrative visual only. Replace with real, date-filtered data before operational use.</p></div></div>
<div class="panel"><div class="panel-head"><div><h3>Priority alerts</h3><p>Connect alerts to inventory and asset modules</p></div><button class="btn" data-page="stock-alerts">View all</button></div><div class="panel-body"><div class="alert-list"><div class="alert"><div class="alert-symbol">⚠</div><div><strong>Low stock alerts</strong><small>Reorder alerts will appear when inventory is connected.</small></div><span class="pill warn">0</span></div><div class="alert red"><div class="alert-symbol">◷</div><div><strong>Expiry / calibration due</strong><small>Due dates will appear from batch and biomedical records.</small></div><span class="pill bad">0</span></div><div class="alert"><div class="alert-symbol">✓</div><div><strong>Pending approvals</strong><small>Purchase and department requests will be listed here.</small></div><span class="pill">0</span></div></div></div></div></div>
<div class="panel"><div class="panel-head"><div><h3>Recent activity</h3><p>Records created in this browser demo only</p></div><button class="btn" data-page="audit-logs">Open activity</button></div><div class="table-wrap"><table><thead><tr><th>Record</th><th>Module</th><th>Created by</th><th>Status</th><th>Source</th></tr></thead><tbody><tr><td colspan="5"><div class="empty"><strong>No live activity available</strong>Connect your audit log endpoint to show real system activity.</div></td></tr></tbody></table></div></div>
<div class="footer">AR Healthcare ERP • Hospital + Pharmacy + Biomedical • Secure backend integration required for production use</div>`}
const fieldMap={
 users:[["name","Full name","text",true],["username","User ID","text",true],["role","Role","select",true,["Administrator","Department Admin","Pharmacist","Doctor","Nurse","Biomedical Engineer","Store Manager","Purchase Officer","Accountant","Billing Operator","Receptionist","HR Manager","Auditor / Read-Only User"]],["department","Department","select",true,["Administration","Hospital","Pharmacy","Biomedical Engineering","Central Store","Accounts","Human Resources","Laboratory","Nursing"]],["status","Account status","select",true,["Active","Suspended"]]],
 medicines:[["name","Medicine name","text",true],["generic","Generic name","text",false],["brand","Brand / manufacturer","text",false],["batch","Batch number","text",true],["expiry","Expiry date","date",true],["pack","Pack conversion (e.g. 1 strip = 10 tablets)","text",false],["strips","Stock (strips)","number",true],["purchaseRate","Purchase rate","number",false],["mrp","MRP","number",false],["reorder","Reorder level (strips)","number",false]],
 assets:[["name","Equipment name","text",true],["assetId","Asset ID","text",true],["serial","Serial number","text",false],["department","Department / location","text",true],["purchaseDate","Purchase date","date",false],["warranty","Warranty end date","date",false],["pmDue","Next PM due date","date",false],["calibrationDue","Next calibration due date","date",false],["status","Asset status","select",true,["Operational","Under Repair","Out of Service","Retired"]]],
 items:[["name","Item name","text",true],["code","Item code","text",true],["category","Category","text",true],["unit","Unit of measure","text",true],["quantity","Opening / counted quantity","number",true],["location","Store / rack","text",false]],
 patients:[["name","Patient name","text",true],["uhid","UHID / Patient ID","text",true],["mobile","Mobile number","tel",false],["gender","Gender","select",false,["Female","Male","Other"]],["department","Department","text",false]],
 suppliers:[["name","Supplier name","text",true],["contact","Contact person","text",false],["mobile","Mobile number","tel",false],["email","Email","email",false],["address","Address","text",false]],
 employees:[["name","Employee name","text",true],["employeeId","Employee ID","text",true],["designation","Designation","text",true],["department","Department","text",true],["mobile","Mobile number","tel",false],["status","Status","select",true,["Active","Inactive"]]],
 complaints:[["assetId","Asset ID","text",true],["reportedBy","Reported by","text",true],["fault","Fault / complaint details","textarea",true],["priority","Priority","select",true,["Low","Medium","High","Critical"]],["status","Status","select",true,["Open","Assigned","In Progress","Resolved"]]],
 workOrders:[["workOrderId","Work order ID","text",true],["assetId","Asset ID","text",true],["engineer","Assigned engineer","text",true],["description","Work details","textarea",true],["dueDate","Due date","date",false],["status","Status","select",true,["Open","In Progress","Completed","On Hold"]]]
};
const keyToData={"users":"users","medicines":"medicines","batches":"medicines","assets":"assets","patients":"patients","patient-search":"patients","items":"items","suppliers":"suppliers","service-vendors":"suppliers","employees":"employees","complaints":"complaints","work-orders":"workOrders","maintenance":"workOrders"};
function datasetKey(){return keyToData[state.page]||state.page}
function recordsFor(){const k=datasetKey();return k==="users"?state.users:(state.records[k]||[])}
function renderRows(rows){if(!rows.length)return `<tr><td colspan="8"><div class="empty"><strong>No records yet</strong>Add a record if this demo supports the module, or connect the existing module API to display live records.</div></td></tr>`;return rows.map((r,i)=>{const vals=Object.entries(r).filter(([k])=>k!=="_createdAt"&&k!=="_id");return `<tr>${vals.slice(0,5).map(([k,v])=>`<td>${escapeHTML(v||"—")}</td>`).join("")}<td><span class="status ${/suspend|repair|critical|expired|open/i.test(String(r.status||""))?"pending":""}">${escapeHTML(r.status||"Saved locally")}</span></td><td><button class="btn danger" data-delete="${i}">Delete</button></td></tr>`}).join("")}
function genericModule(){const k=datasetKey(),rows=recordsFor(),fields=fieldMap[k]||null;const canAdd=canManage()||["medicines","assets","items","patients","suppliers","employees","complaints","workOrders"].includes(k);
if(!fields){return `<div class="module-title"><div><h1>${escapeHTML(pageTitle())}</h1><p>Module entry point in the integrated ERP navigation.</p></div></div><div class="notice"><b>Existing module integration required.</b> This menu is included in the index. To make this screen operational, connect its existing page/component and API from your project. No backend or clinical functionality is fabricated here.</div><div class="panel"><div class="panel-head"><h3>Module integration checklist</h3></div><div class="panel-body"><div class="alert-list"><div class="alert"><div class="alert-symbol">1</div><div><strong>Map existing route or component</strong><small>Use the filename and route already present in your project.</small></div></div><div class="alert"><div class="alert-symbol">2</div><div><strong>Connect authenticated API</strong><small>Use server-side validation and role-based authorization.</small></div></div><div class="alert"><div class="alert-symbol">3</div><div><strong>Verify save, update and reporting</strong><small>Test against the actual database before production use.</small></div></div></div></div></div>`}
const headers=fields.map(f=>`<th>${escapeHTML(f[1])}</th>`).join("");
return `<div class="module-title"><div><h1>${escapeHTML(pageTitle())}</h1><p>Manage records and review current entries.</p></div><div class="actions">${canAdd?'<button class="btn primary" data-action="add">＋ Add Record</button>':''}<button class="btn" data-action="export">Export CSV</button></div></div><div class="notice"><b>Local demo storage:</b> Entries created here are saved only in this browser. This is not a secure multi-user database and is not suitable as the production patient/financial record store. Connect the existing backend before real use.</div><div class="filters"><input id="tableSearch" placeholder="Search records..." /><select id="statusFilter"><option value="">All statuses</option><option>Active</option><option>Operational</option><option>Under Repair</option><option>Open</option><option>Resolved</option><option>Suspended</option></select></div><div class="panel"><div class="table-wrap"><table><thead><tr>${headers}<th>Status</th><th>Action</th></tr></thead><tbody id="recordRows">${renderRows(rows)}</tbody></table></div><div class="panel-head"><p id="recordCount">${rows.length} local record(s)</p><p>Server integration: not configured in this standalone file</p></div></div>`;
}
function render(){renderNav($("globalSearch").value.trim());$("profileName").textContent=state.name;$("profileRole").textContent=state.role;$("avatar").textContent=state.name.split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase();$("content").innerHTML=state.page==="dashboard"?dashboard():genericModule();$("sidebar").classList.remove("open");}
function openModal(){const k=datasetKey();if(k==="users"&&!canManage()){toast("Only an authorized administrator can manage users.");return}const fields=fieldMap[k];if(!fields){toast("Add form is not configured for this module. Connect the existing module.");return}
$("modalTitle").textContent="Add "+pageTitle()+" Record";$("modalBody").innerHTML=`<div class="form-grid">${fields.map(f=>{let control="";if(f[2]==="select")control=`<select name="${f[0]}" ${f[3]?"required":""}>${f[4].map(v=>`<option>${escapeHTML(v)}</option>`).join("")}</select>`;else if(f[2]==="textarea")control=`<textarea name="${f[0]}" rows="3" ${f[3]?"required":""}></textarea>`;else control=`<input name="${f[0]}" type="${f[2]}" ${f[3]?"required":""} ${f[2]==="number"?'min="0" step="any"':""}>`;return `<div class="field"><label>${escapeHTML(f[1])}${f[3]?" *":""}</label>${control}</div>`}).join("")}</div>`;$("modalBackdrop").classList.add("show")}
function closeModal(){$("modalBackdrop").classList.remove("show")}
function saveForm(e){e.preventDefault();const k=datasetKey(),form=new FormData($("recordForm")),record={};for(const [key,val] of form.entries())record[key]=String(val).trim();record._id="LOCAL-"+Date.now();record._createdAt=new Date().toISOString();if(k==="users"){if(state.users.some(u=>u.username.toLowerCase()===record.username.toLowerCase())){toast("That User ID already exists.");return}state.users.push(record);saveUsers()}else{state.records[k]=state.records[k]||[];state.records[k].push(record);saveRecords()}closeModal();render();toast("Saved to this browser's local demo storage. Not synced to server.");}
function exportCSV(){const rows=recordsFor();if(!rows.length){toast("No local records to export on this screen.");return}const cols=[...new Set(rows.flatMap(r=>Object.keys(r)))];const csv=[cols.join(","),...rows.map(r=>cols.map(c=>'"'+String(r[c]??"").replace(/"/g,'""')+'"').join(","))].join("\r\n");const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8;"});const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=datasetKey()+"-local-export.csv";a.click();URL.revokeObjectURL(url);toast("CSV export generated from local demo records.");}
function refreshTable(){const k=datasetKey(),rows=recordsFor(),q=($("tableSearch")?.value||"").toLowerCase(),st=$("statusFilter")?.value||"";const filtered=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q)&&(!st||r.status===st));$("recordRows").innerHTML=renderRows(filtered);$("recordCount").textContent=`${filtered.length} record(s) shown`;}
document.addEventListener("click",e=>{const nav=e.target.closest("[data-page]");if(nav){state.page=nav.dataset.page;render();return}const action=e.target.closest("[data-action]")?.dataset.action;if(action==="add"){openModal();return}if(action==="export"){exportCSV();return}if(action==="quick-add"){if(!canManage()){toast("Ask an administrator to grant this permission.");return}const choices=[["Patient Registration","patients"],["Medicine Master","medicines"],["Equipment Assets","assets"],["Employee Directory","employees"],["User & Role Management","users"]];const choice=prompt("Quick Add — enter number:\n"+choices.map((c,i)=>`${i+1}. ${c[0]}`).join("\n"));const n=Number(choice)-1;if(choices[n]){state.page=choices[n][1];render();openModal()}return}if(e.target.closest("#modalClose")||e.target.closest("#modalCancel")){closeModal();return}if(e.target.closest("#hamb")){$("sidebar").classList.toggle("open");return}if(e.target.closest("#themeBtn")){document.body.classList.toggle("dark");toast("Theme switch is a visual placeholder in this version.");return}if(e.target.closest("#notificationBtn")){state.page="notifications";render();return}if(e.target.closest("#profileMenu")){if(confirm("Switch demo role? OK = choose role, Cancel = logout")){const role=prompt("Select demo role:\nSuper Admin\nAdministrator\nPharmacist\nDoctor\nNurse\nBiomedical Engineer\nStore Manager\nAccountant\nAuditor / Read-Only User",state.role);if(role){state.role=role.trim();state.name=role.trim();renderNav();render();toast("Demo role changed only in this browser. This is not secure authentication.")}}else{state.name="Signed Out";state.role="Guest";render();toast("Demo profile changed. Connect real logout/session handling.")}return}const del=e.target.closest("[data-delete]");if(del){if(!canManage()){toast("You do not have permission to delete records.");return}if(!confirm("Delete this local demo record? This cannot be undone."))return;const k=datasetKey(),idx=Number(del.dataset.delete);if(k==="users"){state.users.splice(idx,1);saveUsers()}else{(state.records[k]||[]).splice(idx,1);saveRecords()}render();toast("Local demo record deleted.");}});
$("recordForm").addEventListener("submit",saveForm);$("globalSearch").addEventListener("input",e=>renderNav(e.target.value.trim()));$("content").addEventListener("input",e=>{if(e.target.id==="tableSearch"||e.target.id==="statusFilter")refreshTable()});$("content").addEventListener("change",e=>{if(e.target.id==="statusFilter")refreshTable()});$("modalBackdrop").addEventListener("click",e=>{if(e.target===$("modalBackdrop"))closeModal()});document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
render();
</script>
</body>
